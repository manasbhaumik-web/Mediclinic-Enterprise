<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Crisp linear gradient for cross depth without blurry rasterization -->
    <linearGradient id="medCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="50%" stop-color="#0f4c5c" />
      <stop offset="100%" stop-color="#04202c" />
    </linearGradient>
    <linearGradient id="innerFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#083344" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="vitalPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- 1. Background Halo/Disc: Semi-translucent biometric ring for maximum contrast on BOTH light and dark themes -->
  <circle cx="100" cy="100" r="92" fill="#041e2b" fill-opacity="0.08" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>

  <!-- 2. Primary Medical Cross Body (Navy/Teal with Crisp Cyan Geometric Stroke) -->
  <!-- Outer Cross Silhouette -->
  <path d="M 74,18 L 126,18 L 126,74 L 182,74 L 182,126 L 126,126 L 126,182 L 74,182 L 74,126 L 18,126 L 18,74 L 74,74 Z" 
        fill="url(#medCrossGrad)" 
        stroke="#00e5ff" 
        stroke-width="3.5" 
        stroke-linejoin="round"/>

  <!-- Inner Architectural Inset Facet -->
  <path d="M 80,24 L 120,24 L 120,68 L 176,68 L 176,120 L 120,120 L 120,176 L 80,176 L 80,120 L 24,120 L 24,68 L 80,68 Z" 
        fill="url(#innerFacet)" 
        stroke="#38bdf8" 
        stroke-width="1.5" 
        stroke-opacity="0.45"/>

  <!-- 3. Dynamic ECG Vital Cardiogram Telemetry Wave -->
  <!-- Glow underlay wave -->
  <polyline points="14,100 58,100 68,90 76,100 84,120 100,34 116,140 128,82 138,100 186,100" 
            fill="none" 
            stroke="#00e5ff" 
            stroke-width="6.5" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            stroke-opacity="0.4"/>

  <!-- High-contrast primary pulse wave -->
  <polyline points="14,100 58,100 68,90 76,100 84,120 100,34 116,140 128,82 138,100 186,100" 
            fill="none" 
            stroke="url(#vitalPulse)" 
            stroke-width="3.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

  <!-- Core white highlight spine for optical crispness on calibrated hospital monitors -->
  <polyline points="22,100 58,100 68,90 76,100 84,120 100,34 116,140 128,82 138,100 178,100" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="1.5" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            stroke-opacity="0.95"/>

  <!-- 4. Biometric Peak Nodes -->
  <!-- Systolic QRS Apex Node -->
  <circle cx="100" cy="34" r="5.5" fill="#ffffff" stroke="#00e5ff" stroke-width="2"/>
  <!-- Ventricular S-wave Node -->
  <circle cx="116" cy="140" r="4" fill="#00e5ff" stroke="#041e2b" stroke-width="1.5"/>
  <!-- T-Wave Node -->
  <circle cx="128" cy="82" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
  <!-- Terminal Baseline Node -->
  <circle cx="138" cy="100" r="3" fill="#ffffff"/>
</svg>
