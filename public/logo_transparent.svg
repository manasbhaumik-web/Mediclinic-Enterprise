<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Crisp white/silver gradient for medical cross body -->
    <linearGradient id="pureCrossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>

    <!-- Deep high-contrast teal/navy for central vital wave -->
    <linearGradient id="vitalWaveDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <!-- Subtle inner bevel for the cross -->
    <linearGradient id="crossBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
  </defs>

  <!-- 1. Pure White / Ice Mint Solid Medical Cross (Provides maximum contrast against deep teal/emerald background) -->
  <path d="M 74,18 L 126,18 L 126,74 L 182,74 L 182,126 L 126,126 L 126,182 L 74,182 L 74,126 L 18,126 L 18,74 L 74,74 Z" 
        fill="url(#pureCrossGrad)" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Inner crisp facet -->
  <path d="M 80,24 L 120,24 L 120,68 L 176,68 L 176,120 L 120,120 L 120,176 L 80,176 L 80,120 L 24,120 L 24,68 L 80,68 Z" 
        fill="url(#crossBevel)" 
        stroke="#99f6e4" 
        stroke-width="1.5" 
        stroke-opacity="0.8"/>

  <!-- 2. Outer Halo Accent Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="4 3" stroke-opacity="0.75"/>

  <!-- 3. Dynamic ECG Cardiogram Vital Surge in Deep Medical Teal/Navy -->
  <!-- Crisp high-contrast pulse line -->
  <polyline points="14,100 58,100 68,90 76,100 84,122 100,32 116,142 128,80 138,100 186,100" 
            fill="none" 
            stroke="#042f2e" 
            stroke-width="4.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

  <!-- Core cyan highlight trace -->
  <polyline points="20,100 58,100 68,90 76,100 84,122 100,32 116,142 128,80 138,100 180,100" 
            fill="none" 
            stroke="#0d9488" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

  <!-- 4. Biometric Peak Telemetry Nodes -->
  <!-- Systolic QRS Apex Node -->
  <circle cx="100" cy="32" r="5" fill="#042f2e" stroke="#ffffff" stroke-width="2"/>
  <!-- Ventricular S-wave Node -->
  <circle cx="116" cy="142" r="4" fill="#0f766e" stroke="#ffffff" stroke-width="1.5"/>
  <!-- T-Wave Node -->
  <circle cx="128" cy="80" r="3.5" fill="#14b8a6" stroke="#ffffff" stroke-width="1"/>
  <!-- Terminal Baseline Node -->
  <circle cx="138" cy="100" r="3" fill="#042f2e"/>
</svg>
