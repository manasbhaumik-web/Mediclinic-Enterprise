<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Dynamic Theme Cross Gradient using currentColor and theme accent variables -->
    <linearGradient id="themeCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--color-primary, #0f766e)" />
      <stop offset="100%" stop-color="var(--color-chrome-deep, #065f5b)" />
    </linearGradient>

    <!-- Inner Architectural Facet -->
    <linearGradient id="themeFacetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--color-accent, #0d9488)" stop-opacity="0.4" />
      <stop offset="100%" stop-color="var(--color-chrome-deep, #065f5b)" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- 1. Free-Standing Medical Cross in Dynamic Theme Primary Color with Crisp White Perimeter -->
  <path d="M 72,16 L 128,16 L 128,72 L 184,72 L 184,128 L 128,128 L 128,184 L 72,184 L 72,128 L 16,128 L 16,72 L 72,72 Z" 
        fill="url(#themeCrossGrad)" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linejoin="round"/>

  <!-- Inner Architectural Inset -->
  <path d="M 78,22 L 122,22 L 122,68 L 178,68 L 178,122 L 122,122 L 122,178 L 78,178 L 78,122 L 22,122 L 22,68 L 78,68 Z" 
        fill="url(#themeFacetGrad)" 
        stroke="var(--color-brand, #14b8a6)" 
        stroke-width="1.5" 
        stroke-opacity="0.65"/>

  <!-- 2. Dynamic ECG Vital Cardiogram Telemetry Wave Across the Cross -->
  <!-- Dark underlay shadow for razor-sharp separation on any surface -->
  <polyline points="10,100 56,100 66,90 74,100 82,122 100,32 118,142 130,80 140,100 190,100" 
            fill="none" 
            stroke="#04202c" 
            stroke-width="7" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

  <!-- Theme Brand Accent Pulse Line -->
  <polyline points="10,100 56,100 66,90 74,100 82,122 100,32 118,142 130,80 140,100 190,100" 
            fill="none" 
            stroke="var(--color-brand, #00e5ff)" 
            stroke-width="3.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

  <!-- Core Pure White Trace for High-Precision Optical Crispness -->
  <polyline points="18,100 56,100 66,90 74,100 82,122 100,32 118,142 130,80 140,100 182,100" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="1.8" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

  <!-- 3. Biometric Telemetry Peak Nodes -->
  <!-- Systolic QRS Apex Node -->
  <circle cx="100" cy="32" r="5.5" fill="#ffffff" stroke="var(--color-primary, #0f766e)" stroke-width="2"/>
  <!-- Ventricular S-wave Node -->
  <circle cx="118" cy="142" r="4.2" fill="var(--color-brand, #00e5ff)" stroke="#ffffff" stroke-width="1.5"/>
  <!-- T-Wave Node -->
  <circle cx="130" cy="80" r="3.5" fill="#ffffff" stroke="var(--color-accent, #0d9488)" stroke-width="1.2"/>
  <!-- Terminal Baseline Connection Nodes -->
  <circle cx="18" cy="100" r="3" fill="#ffffff"/>
  <circle cx="182" cy="100" r="3" fill="#ffffff"/>
</svg>
