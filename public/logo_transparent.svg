<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f3c4c" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#14b8a6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Transparent Background Shield Container -->
  <g filter="url(#glow)">
    <!-- Outer Shield Border -->
    <path d="M100 20 L165 50 V110 C165 150 135 180 100 190 C65 180 35 150 35 110 V50 Z" 
          fill="url(#shieldGrad)" 
          stroke="#2dd4bf" 
          stroke-width="3" 
          stroke-linejoin="miter"/>

    <!-- Inner Shield Inset Line -->
    <path d="M100 28 L157 54 V108 C157 144 130 171 100 180 C70 171 43 144 43 108 V54 Z" 
          fill="none" 
          stroke="#5eead4" 
          stroke-width="1.5" 
          stroke-opacity="0.4"/>

    <!-- Sharp Medical Cross (Vertical Bar) -->
    <rect x="88" y="65" width="24" height="70" fill="url(#crossGrad)" rx="0"/>
    
    <!-- Sharp Medical Cross (Horizontal Bar) -->
    <rect x="65" y="88" width="70" height="24" fill="url(#crossGrad)" rx="0"/>

    <!-- ECG Vital Pulse Line Over Cross -->
    <path d="M50 100 H75 L82 88 L92 118 L102 75 L112 112 L120 95 L126 100 H150" 
          fill="none" 
          stroke="#092e38" 
          stroke-width="3.5" 
          stroke-linecap="square" 
          stroke-linejoin="miter"/>
  </g>
</svg>
