name: Node.js CI Build

# Trigger the workflow on pushes or pull requests to your main branch
on:
  push:
    branches: [ "Main", "main" ]
  pull_request:
    branches: [ "Main", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # matrix runs the build across multiple Node versions simultaneously
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm' # Automatically caches node_modules for faster subsequent builds

    - name: Install dependencies
      run: npm ci 
      # Note: 'npm ci' is preferred in automated builds over 'npm install' 
      # because it strictly respects your package-lock.json

    - name: Run Build / Compile
      run: npm run build --if-present

    - name: Run Tests
      run: npm test --if-present
