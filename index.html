<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Mediclinic Enterprise | 24/7 Smart Outpatient Medical Center</title>
  <link rel="icon" type="image/svg+xml" href="./logo_transparent.svg">
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:9999;padding:20px;font-family:monospace;white-space:pre-wrap;">' + e.error.stack + '</div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML += '<div style="position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:9999;padding:20px;font-family:monospace;white-space:pre-wrap;">Unhandled Rejection: ' + e.reason + '</div>';
    });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    @keyframes ecgStroke {
      0% { stroke-dashoffset: 400; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }
    @keyframes barSlide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .preloader-bg {
      position: fixed;
      inset: 0;
      background-color: #07252d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      z-index: 99999;
      color: #5eead4;
      padding: 24px;
    }
    .ecg-path {
      stroke-dasharray: 400;
      animation: ecgStroke 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Initial App Preloader Animation before React Mounts -->
    <div class="preloader-bg">
      <div style="background: #082830; border: 2px solid #0d9488; padding: 24px; max-width: 400px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center;">
        
        <div style="display: flex; items-center; justify-content: space-between; border-bottom: 1px solid rgba(45,212,191,0.3); padding-bottom: 8px; margin-bottom: 16px; font-family: monospace; font-size: 10px; font-weight: 700;">
          <span style="color: #34d399; display: flex; align-items: center; gap: 6px;">● TELEMETRY SYSTEM ACTIVE</span>
          <span style="color: #0d9488; background: #e0f5f2; padding: 2px 6px;">24/7 EMR HUB</span>
        </div>

        <div style="position: relative; background: #07252d; border: 1px solid rgba(13,148,136,0.5); padding: 12px; margin-bottom: 16px; height: 100px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
          <svg style="width: 100%; height: 70px;" viewBox="0 0 500 120" fill="none">
            <path d="M0 60 L120 60 L135 60 L145 20 L155 100 L165 40 L175 75 L185 60 L320 60 L335 60 L345 20 L355 100 L365 40 L375 75 L385 60 L500 60" stroke="#0f766e" stroke-width="2" stroke-opacity="0.4" />
            <path class="ecg-path" d="M0 60 L120 60 L135 60 L145 20 L155 100 L165 40 L175 75 L185 60 L320 60 L335 60 L345 20 L355 100 L365 40 L375 75 L385 60 L500 60" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div style="position: absolute; background: rgba(7, 37, 45, 0.95); border: 1px solid #0d9488; padding: 6px 12px; display: flex; align-items: center; gap: 8px;">
            <img src="./logo_transparent.svg" alt="Mediclinic" style="width: 24px; height: 24px;" />
            <span style="font-family: monospace; font-size: 11px; font-weight: 900; color: #5eead4; text-transform: uppercase;">Mediclinic Enterprise</span>
          </div>
        </div>

        <h3 style="font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin: 0; color: #5eead4;">
          INITIALIZING CLINICAL ENCOUNTER WORKSPACE
        </h3>
        
        <div style="width: 100%; height: 6px; background: #082830; border: 1px solid rgba(45,212,191,0.3); margin-top: 14px; overflow: hidden; position: relative;">
          <div style="width: 80px; height: 100%; background: #2dd4bf; animation: barSlide 1.5s infinite linear;"></div>
        </div>

        <span style="font-family: monospace; font-size: 10px; color: #94a3b8; display: block; margin-top: 8px;">
          Securing EMR Telemetry &amp; Patient Encounters...
        </span>

      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
