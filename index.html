<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mediclinic Enterprise | 24/7 Smart Outpatient Medical Center</title>
  <link rel="icon" type="image/svg+xml" href="./logo_transparent.svg">
  <script>
    function showFatalError(message) {
      var banner = document.createElement('div');
      banner.className = 'app-error-overlay';
      banner.textContent = message;
      document.body.appendChild(banner);
    }
    window.addEventListener('error', function(e) {
      showFatalError(e.error && e.error.stack ? e.error.stack : String(e.message));
    });
    window.addEventListener('unhandledrejection', function(e) {
      showFatalError('Unhandled Rejection: ' + e.reason);
    });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Single application stylesheet (design tokens + shared classes) -->
  <link rel="stylesheet" href="/src/index.css">
</head>

<body>
  <div id="root">
    <!-- Boot screen shown until React mounts -->
    <div class="app-preloader">
      <div class="app-preloader-mark">
        <div class="app-preloader-ring"></div>
        <div class="app-preloader-logo">
          <img src="./logo_transparent.svg" alt="Mediclinic" />
        </div>
      </div>
      <h2 class="app-preloader-title">MEDICLINIC ENTERPRISE</h2>
      <p class="app-preloader-status">Loading Clinical Suite...</p>
      <div class="app-preloader-track">
        <div class="app-preloader-bar"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
