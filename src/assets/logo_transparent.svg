<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Dark Sky Blue shield base gradient -->
    <linearGradient id="darkSkyBlueBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Deep oceanic shade for inner architectural contrast -->
    <linearGradient id="innerSkyFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.8" />
    </linearGradient>

    <!-- Bright Sky Blue for pulse telemetry -->
    <linearGradient id="skyPulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
  </defs>

  <!-- 1. Circular Shield Base in Rich Dark Sky Blue with Bold White Outline -->
  <circle cx="100" cy="100" r="93" 
          fill="url(#darkSkyBlueBase)" 
          stroke="#ffffff" 
          stroke-width="4"/>

  <!-- Subtle inner dashed technical alignment ring -->
  <circle cx="100" cy="100" r="86" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1.2" 
          stroke-opacity="0.4" 
          stroke-dasharray="3 3"/>

  <!-- 2. Medical Cross Body: Dark Sky Blue with Clean White Outline -->
  <!-- Outer Cross Contour -->
  <path d="M 74,30 L 126,30 L 126,74 L 170,74 L 170,126 L 126,126 L 126,170 L 74,170 L 74,126 L 30,126 L 30,74 L 74,74 Z" 
        fill="#075985" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Inner Architectural Inset with Deep Contrast -->
  <path d="M 78,34 L 122,34 L 122,70 L 166,70 L 166,122 L 122,122 L 122,166 L 78,166 L 78,122 L 34,122 L 34,70 L 78,70 Z" 
        fill="url(#innerSkyFacet)" 
        stroke="#7dd3fc" 
        stroke-width="1.2" 
        stroke-opacity="0.5"/>

  <!-- 3. Dynamic ECG Vital Cardiogram Telemetry Wave -->
  <!-- Crisp high-contrast dark underlay shadow for razor-sharp separation -->
  <polyline points="18,100 58,100 68,90 76,100 84,122 100,34 116,142 128,82 138,100 182,100" 
            fill="none" 
            stroke="#082f49" 
            stroke-width="6.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

  <!-- Bright Sky Blue Glow Wave -->
  <polyline points="18,100 58,100 68,90 76,100 84,122 100,34 116,142 128,82 138,100 182,100" 
            fill="none" 
            stroke="#38bdf8" 
            stroke-width="3.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

  <!-- Brilliant White Spine Wave for High-Visibility Precision -->
  <polyline points="24,100 58,100 68,90 76,100 84,122 100,34 116,142 128,82 138,100 176,100" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="1.8" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

  <!-- 4. Biometric Peak Telemetry Nodes -->
  <!-- Systolic QRS Apex Node (Prominent White with Dark Sky Blue Core) -->
  <circle cx="100" cy="34" r="5.5" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
  <!-- Ventricular S-wave Node -->
  <circle cx="116" cy="142" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <!-- T-Wave Node -->
  <circle cx="128" cy="82" r="3.5" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <!-- Terminal Baseline Connection Points -->
  <circle cx="24" cy="100" r="3" fill="#ffffff"/>
  <circle cx="176" cy="100" r="3" fill="#ffffff"/>
</svg>
