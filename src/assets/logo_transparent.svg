<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Solid dark teal shield base for universal contrast -->
    <linearGradient id="shieldBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a4d5c" />
      <stop offset="50%" stop-color="#083a47" />
      <stop offset="100%" stop-color="#04232c" />
    </linearGradient>

    <!-- Vibrant cyan perimeter glow border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Pure white & mint cross core -->
    <linearGradient id="crossCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0fdf4" />
    </linearGradient>

    <!-- High-impact cardiogram pulse gradient -->
    <linearGradient id="ecgGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
  </defs>

  <!-- 1. Universal Contrast Shield Disc: Deep Midnight Teal Anchor (#083a47) with Electric Cyan Border -->
  <!-- This guarantees the logo pops with high contrast on BOTH White/Ice-Mint surfaces AND Deep Teal / Dark surfaces -->
  <circle cx="100" cy="100" r="94" fill="url(#shieldBase)" stroke="url(#borderGrad)" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 3"/>

  <!-- 2. Medical Cross Silhouette (Sharp Pure White Interior) -->
  <path d="M 74,30 L 126,30 L 126,74 L 170,74 L 170,126 L 126,126 L 126,170 L 74,170 L 74,126 L 30,126 L 30,74 L 74,74 Z" 
        fill="url(#crossCore)" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-linejoin="round"/>

  <!-- Inner Architectural Inset in Cross -->
  <path d="M 78,34 L 122,34 L 122,70 L 166,70 L 166,122 L 122,122 L 122,166 L 78,166 L 78,122 L 34,122 L 34,70 L 78,70 Z" 
        fill="#f0fdfa" 
        stroke="#a7f3d0" 
        stroke-width="1.5" 
        stroke-opacity="0.6"/>

  <!-- 3. Dynamic ECG Vital Cardiogram Telemetry Wave Across the Shield -->
  <!-- Shadow/Dark contrast outline under wave -->
  <polyline points="18,100 58,100 68,90 76,100 84,122 100,34 116,142 128,82 138,100 182,100" 
            fill="none" 
            stroke="#04232c" 
            stroke-width="6" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

  <!-- Electric Cyan Vital Surge Line -->
  <polyline points="18,100 58,100 68,90 76,100 84,122 100,34 116,142 128,82 138,100 182,100" 
            fill="none" 
            stroke="#00e5ff" 
            stroke-width="3.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

  <!-- Bright White Spine for Razor-Sharp Crispness -->
  <polyline points="24,100 58,100 68,90 76,100 84,122 100,34 116,142 128,82 138,100 176,100" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="1.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

  <!-- 4. Biometric Peak Nodes -->
  <!-- Systolic QRS Apex Node -->
  <circle cx="100" cy="34" r="5" fill="#ffffff" stroke="#00e5ff" stroke-width="2"/>
  <!-- Ventricular S-wave Node -->
  <circle cx="116" cy="142" r="4" fill="#00e5ff" stroke="#04232c" stroke-width="1.5"/>
  <!-- T-Wave Node -->
  <circle cx="128" cy="82" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
  <!-- Terminal Baseline Nodes -->
  <circle cx="24" cy="100" r="2.5" fill="#00e5ff"/>
  <circle cx="176" cy="100" r="2.5" fill="#00e5ff"/>
</svg>
